<!doctype html><html><body><pre id=o></pre><script>
var q=new URLSearchParams(location.search),f=document.createElement('iframe');f.src=q.get('u')||'/football';f.style.cssText='width:390px;height:9000px;border:0';document.body.appendChild(f);
f.onload=function(){setTimeout(function(){var d=f.contentDocument,W=d.documentElement.clientWidth,out=['clientW='+W+' scrollW='+d.documentElement.scrollWidth+' body.scrollW='+d.body.scrollWidth];
d.querySelectorAll('body *').forEach(function(e){var r=e.getBoundingClientRect();if(r.right>W+1&&r.width>0){var p=e.parentElement,pr=p.getBoundingClientRect();if(pr.right<=W+1)out.push(e.tagName+'.'+e.className+' #'+e.id+' right='+Math.round(r.right)+' w='+Math.round(r.width))}});
document.getElementById('o').textContent=out.slice(0,40).join('\n');},q.get('t')||4000)};
</script></body></html>
