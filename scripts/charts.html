<!doctype html><html><body><pre id=o></pre><script>
var q=new URLSearchParams(location.search),f=document.createElement('iframe');f.src=q.get('u');f.style.cssText='width:390px;height:14000px;border:0';document.body.appendChild(f);
f.onload=function(){setTimeout(function(){var d=f.contentDocument,out=['docW='+d.documentElement.scrollWidth];
d.querySelectorAll('.chart__plot').forEach(function(e){var s=e.querySelector('svg');out.push('plot cw='+e.clientWidth+' sw='+e.scrollWidth+(s?' svg='+Math.round(s.getBoundingClientRect().width)+' minW='+s.style.minWidth+' cssMin='+getComputedStyle(s).minWidth:' nosvg'))});
document.getElementById('o').textContent=out.join('\n');},5000)};
</script></body></html>
